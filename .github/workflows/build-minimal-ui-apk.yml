name: Build minimal UI test APK

on:
  push:
    branches:
      - ui/minimal-system-font
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout patched source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK and build tools
        shell: bash
        run: |
          set -euxo pipefail
          sdkmanager 'ndk;27.2.12479018' 'build-tools;35.0.0' >/dev/null

      - name: Download and verify official AGENTCODI 0.6.7 APK
        shell: bash
        run: |
          set -euxo pipefail
          curl --fail --location --retry 3 \
            'https://github.com/Mcpasi/AGENTCODI/releases/download/Early_access_v0.6.7/AGENTCODI-0.6.7-arm64-v8a-release.apk' \
            --output original.apk
          echo '52b7127733904610888c26c9c87dcf541f4b7dbe3122f7c7cf1dd531940b5e45  original.apk' | sha256sum -c -

      - name: Download apktool
        shell: bash
        run: |
          set -euxo pipefail
          curl --fail --location --retry 3 \
            'https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar' \
            --output apktool.jar

      - name: Decode APK and apply framing fix
        shell: bash
        run: |
          set -euxo pipefail
          java -jar apktool.jar d -f original.apk -o decoded

          client_file="$(find decoded -type f -path '*/de/agentcodi/core/CodexAppServerClient.smali' -print -quit)"
          json_file="$(find decoded -type f -path '*/de/agentcodi/core/JsonCodec.smali' -print -quit)"
          test -n "$client_file"
          test -n "$json_file"

          sed -i 's/MAX_INCOMING_BYTES:I = 0x100000/MAX_INCOMING_BYTES:I = 0x1000000/' "$client_file"
          sed -i 's/MAX_INPUT_CHARACTERS:I = 0x100000/MAX_INPUT_CHARACTERS:I = 0x1000000/' "$json_file"
          sed -i 's/MAX_STRING_CHARACTERS:I = 0x80000/MAX_STRING_CHARACTERS:I = 0x1000000/' "$json_file"

          grep -q 'MAX_INCOMING_BYTES:I = 0x1000000' "$client_file"
          grep -q 'MAX_INPUT_CHARACTERS:I = 0x1000000' "$json_file"
          grep -q 'MAX_STRING_CHARACTERS:I = 0x1000000' "$json_file"

      - name: Apply minimal warm UI and system font
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          # Values are ARGB ints. Replace the original cyan/navy palette and
          # chat-state tints with the warm near-black palette used by the UI branch.
          mapping = {
              0xFF090E1A: 0xFF0B0B0A, # page
              0xFF131B2B: 0xFF11110F, # surface
              0xFF1A2437: 0xFF1A1917, # raised surface
              0xFFF4F7FB: 0xFFE9E6E0, # primary text
              0xFFAAB5C7: 0xFF77736D, # secondary text
              0xFF2DD4BF: 0xFF9A4D3C, # accent
              0xFF2C3A50: 0xFF2A2824, # border
              0xFFFCA5A5: 0xFFC96F5E, # danger
              0xFF99F6E4: 0xFFB8B2AA, # secondary icon/text accent
              0xFF123B3A: 0xFF211816, # user / active tint
              0xFF3A2420: 0xFF241917, # system/failure tint
              0xFF25203D: 0xFF171614, # reasoning tint
              0xFF172E46: 0xFF171614, # plan tint
              0xFF1C3040: 0xFF181614, # streaming tint
              0xFF162D29: 0xFF151412, # generic status tint
          }

          const_re = re.compile(r'(\bconst(?:/4|/16|/high16)?\s+[^,]+,\s+)(-?0x[0-9a-fA-F]+)')
          counts = {k: 0 for k in mapping}

          def signed_literal(u):
              u &= 0xffffffff
              if u & 0x80000000:
                  return '-0x%x' % ((1 << 32) - u)
              return '0x%x' % u

          for path in Path('decoded').glob('smali*/**/*.smali'):
              text = path.read_text(encoding='utf-8')
              changed = False
              def repl(match):
                  nonlocal_changed = None
                  token = match.group(2)
                  value = int(token, 16) if token.startswith('0x') else -int(token[3:], 16)
                  u = value & 0xffffffff
                  if u not in mapping:
                      return match.group(0)
                  counts[u] += 1
                  return match.group(1) + signed_literal(mapping[u])
              new = const_re.sub(repl, text)
              if new != text:
                  path.write_text(new, encoding='utf-8')

          required = [
              0xFF090E1A, 0xFF131B2B, 0xFF1A2437, 0xFFF4F7FB,
              0xFFAAB5C7, 0xFF2DD4BF, 0xFF2C3A50, 0xFFFCA5A5,
          ]
          missing = [hex(v) for v in required if counts[v] == 0]
          if missing:
              raise SystemExit('UI palette constants not found: ' + ', '.join(missing))
          print('palette replacements:', {hex(k): v for k, v in counts.items() if v})

          removed_font = 0
          for path in Path('decoded/res').glob('values*/styles.xml'):
              text = path.read_text(encoding='utf-8')
              new, n = re.subn(r'\s*<item name="android:fontFamily">sans</item>', '', text)
              if n:
                  path.write_text(new, encoding='utf-8')
                  removed_font += n
          if removed_font == 0:
              raise SystemExit('Expected fixed android:fontFamily entry was not found')
          print('removed fixed fontFamily entries:', removed_font)
          PY

      - name: Rebuild patched ARM64 JNI engine
        shell: bash
        run: |
          set -euxo pipefail
          ndk="$ANDROID_HOME/ndk/27.2.12479018"
          toolchain="$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin"
          cxx="$toolchain/aarch64-linux-android29-clang++"
          strip="$toolchain/llvm-strip"
          src='modules/native-engine/src/main/cpp'

          "$cxx" -shared -fPIC -std=c++17 -O2 -Wall -Wextra -Werror -pthread \
            -fvisibility=hidden -I"$src" \
            "$src/agentcodi_engine.cpp" \
            "$src/app_server_process.cpp" \
            "$src/png_validator.cpp" \
            "$src/sha256.cpp" \
            "$src/workspace_directory_reader.cpp" \
            "$src/workspace_file_reader.cpp" \
            "$src/workspace_import_installer.cpp" \
            "$src/jni_bridge.cpp" \
            -Wl,-soname,libagentcodi.so -lz -llog \
            -o decoded/lib/arm64-v8a/libagentcodi.so
          "$strip" --strip-unneeded decoded/lib/arm64-v8a/libagentcodi.so

          file decoded/lib/arm64-v8a/libagentcodi.so
          strings decoded/lib/arm64-v8a/libagentcodi.so | grep -F 'Incoming app-server byte limit is invalid'

      - name: Rebuild APK
        shell: bash
        run: |
          set -euxo pipefail
          java -jar apktool.jar b decoded -o unsigned.apk

      - name: Sign APK with disposable test key
        shell: bash
        run: |
          set -euxo pipefail
          build_tools="$ANDROID_HOME/build-tools/35.0.0"
          keytool -genkeypair -noprompt \
            -keystore minimal-ui-debug.keystore \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname 'CN=AGENTCODI Minimal UI Test,O=levomm,C=EE'

          "$build_tools/zipalign" -p -f 4 unsigned.apk aligned.apk
          "$build_tools/apksigner" sign \
            --ks minimal-ui-debug.keystore \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out AGENTCODI-0.6.7-minimal-ui-arm64-v8a.apk \
            aligned.apk
          "$build_tools/apksigner" verify --verbose --print-certs AGENTCODI-0.6.7-minimal-ui-arm64-v8a.apk
          sha256sum AGENTCODI-0.6.7-minimal-ui-arm64-v8a.apk > AGENTCODI-0.6.7-minimal-ui-arm64-v8a.apk.sha256

      - name: Upload minimal UI APK
        uses: actions/upload-artifact@v4
        with:
          name: AGENTCODI-0.6.7-minimal-ui-arm64-v8a
          path: |
            AGENTCODI-0.6.7-minimal-ui-arm64-v8a.apk
            AGENTCODI-0.6.7-minimal-ui-arm64-v8a.apk.sha256
          if-no-files-found: error
          retention-days: 7
